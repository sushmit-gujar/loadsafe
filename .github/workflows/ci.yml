name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]"
          # Optional heavy deps for the corpus tests (skipped if missing).
          pip install "numpy>=1.26" "joblib>=1.3" "scikit-learn>=1.3" \
            "safetensors>=0.4" "onnx>=1.15" "gguf>=0.10" \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch" || true
      - run: ruff check .
      - run: mypy src
      - run: pytest -q
      - name: Self-scan examples
        run: loadsafe scan examples/hf_repo examples/tiny.safetensors --fail-on high --format text
